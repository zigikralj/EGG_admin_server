name: Deploy Backend to Render

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  test_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # (Optional) Run tests / linting here
      # - run: npm test

      - name: Trigger Render Deploy Hook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
