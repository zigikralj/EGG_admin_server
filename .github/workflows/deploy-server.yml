name: Deploy Server to Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Validate Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build server (Prisma Generate & TypeScript Compile)
        run: npm run build

  deploy:
    name: Trigger Render Deployment
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set in GitHub repository settings."
            echo "Please add RENDER_DEPLOY_HOOK_URL under Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Triggering Render deployment..."
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          if [ "$response" -eq 200 ] || [ "$response" -eq 201 ] || [ "$response" -eq 202 ]; then
            echo "Successfully triggered Render deployment (HTTP status $response)."
          else
            echo "::error::Failed to trigger Render deployment. Server returned HTTP status $response."
            exit 1
          fi
